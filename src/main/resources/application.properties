# Banco: PostgreSQL, um esquema por módulo (ADR 0004).
# Em produção, a conexão vem das variáveis QUARKUS_DATASOURCE_*.
# Em dev e teste sem conexão informada, os Dev Services sobem um PostgreSQL em container.
quarkus.datasource.db-kind=postgresql

# O esquema é das migrações (uma por módulo, só no esquema dele), nunca do Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=shared,originacao,credito,avaliacao,contratacao,garantia,desembolso,documentos
quarkus.flyway.create-schemas=true

quarkus.http.port=8080

# Prazos das propostas (RN-0020, RN-0021, RN-0022): verificados todo dia, logo após a meia-noite.
originacao.prazos.cron=0 5 0 * * ?
%test.quarkus.scheduler.enabled=false

# Arquivos dos documentos (ADR 0010): no sistema de arquivos até o adaptador de armazenamento de objetos.
documentos.armazem.diretorio=${java.io.tmpdir}/financiamento-documentos
%test.documentos.armazem.diretorio=target/documentos

# Autenticação delegada (ADR 0012): o token JWT vem de um emissor externo (Keycloak, Entra ID, IdP corporativo).
# A aplicação só valida a assinatura (JWKS), o emissor e a validade, e autoriza pelos papéis e pelo dono.
mp.jwt.verify.issuer=${JWT_ISSUER:https://emissor.exemplo}
mp.jwt.verify.publickey.location=${JWT_JWKS_URL:https://emissor.exemplo/.well-known/jwks.json}
# Claim com os papéis (padrão MP-JWT: groups) e claim com o CPF/CNPJ do usuário.
smallrye.jwt.path.groups=${JWT_CLAIM_PAPEIS:groups}
financiamento.seguranca.claim-do-documento=${JWT_CLAIM_DOCUMENTO:cpf}
# Nega por padrão: endpoint sem @RolesAllowed não responde. Autenticação no fluxo do JAX-RS, para os erros saírem no formato do catálogo.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
quarkus.http.auth.proactive=false
%test.mp.jwt.verify.issuer=https://emissor.teste
%test.mp.jwt.verify.publickey.location=publicKey.pem

# Contrato da API (OpenAPI), gerado do código e gravado em docs/api a cada build: mudança de contrato aparece no diff.
quarkus.smallrye-openapi.info-title=Sistema de financiamento de bens
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=API do financiamento de veículos, imóveis e terrenos. Guia de integração em docs/api/README.md; catálogo de erros em docs/api/catalogo-de-erros.md.
quarkus.smallrye-openapi.store-schema-directory=docs/api
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=jwt
quarkus.smallrye-openapi.security-scheme-description=JWT do emissor externo (ADR 0012): papéis na claim groups, CPF/CNPJ na claim cpf.

# Sistemas externos (ADR 0013): o relay do outbox entrega cada pedido pelo cliente HTTP da camada anticorrupção
# do módulo dono, e o externo devolve o resultado em /retornos/... (idempotente). Por padrão, todos no mesmo
# endereço: o WireMock que os simula (docker/compose.yml). Cada um pode ser apontado à parte, por exemplo
# QUARKUS_REST_CLIENT_BUREAU_URL.
externos.url=${EXTERNOS_URL:http://localhost:8089}
quarkus.rest-client.bureau.url=${externos.url}
quarkus.rest-client.avaliador.url=${externos.url}
quarkus.rest-client.seguradora.url=${externos.url}
quarkus.rest-client.cartorio.url=${externos.url}
quarkus.rest-client.orgao-de-transito.url=${externos.url}
quarkus.rest-client.fgts.url=${externos.url}
quarkus.rest-client.pagamento.url=${externos.url}
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=10000
# Endereço pelo qual os externos alcançam esta aplicação, para devolver os resultados.
financiamento.url-publica=${URL_PUBLICA:http://localhost:8080}
# Relay do outbox: a cada intervalo, envia os pendentes; falha temporária volta com recuo exponencial.
outbox.relay.intervalo=${OUTBOX_RELAY_INTERVALO:5s}
