# Banco: PostgreSQL, um esquema por módulo (ADR 0004).
# Em produção, a conexão vem das variáveis QUARKUS_DATASOURCE_*.
# Em dev e teste sem conexão informada, os Dev Services sobem um PostgreSQL em container.
quarkus.datasource.db-kind=postgresql

# O esquema é das migrações (uma por módulo, só no esquema dele), nunca do Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=shared,originacao
quarkus.flyway.create-schemas=true

quarkus.http.port=8080
